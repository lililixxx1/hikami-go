name: Deploy Pages

# 用 GitHub Actions workflow 模式部署 GitHub Pages,取代 legacy 部署(后者反复 deploy 超时/卡死)。
# docs/ 是纯静态站点(.nojekyll + index.html),无需构建步骤,直接上传为 Pages artifact 部署。
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个 Pages 部署,避免并发推送时旧部署覆盖新部署。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
