name: Preview Build

# 预览包:每次推送 main(纯文档/站点改动跳过)或手动触发,自动构建
# Windows 桌面版(内嵌 ffmpeg + 前端 + 托盘)exe:
# 1) 上传为 workflow artifact(带短 SHA,保留 30 天,登录后可下载历史);
# 2) 附加到固定 tag `preview` 的滚动预发布(公开直链,无需登录,始终只有一条,
#    同名资产自动覆盖,不占 Latest 徽章,不触发 release.yml 的 v* 门禁)。
# 产物与 Release 流程同源(release.yml 单矩阵项);正式发布仍走 release.yml
# (push v* tag,含全量测试门禁)。

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write # 移动 preview tag + 创建/更新滚动预发布

# 新推送到来时取消仍在跑的旧预览构建,不排队
concurrency:
  group: preview-build
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: Build frontend
        run: npm run build
        working-directory: web

      - name: Copy frontend to embed dir
        run: |
          rm -rf cmd/hikami/webdist
          cp -r web/dist cmd/hikami/webdist

      - name: Verify embedded ffmpeg asset
        run: |
          # 裁剪版 ffmpeg.zip 已入库(internal/runtime/assets/ffmpeg.zip),
          # 顶层结构 bin/ffmpeg.exe + bin/ffprobe.exe,与 ffmpeg_manifest.go 一致。
          if [ ! -f internal/runtime/assets/ffmpeg.zip ]; then
            echo "ERROR: internal/runtime/assets/ffmpeg.zip not found. Run 'make build-ffmpeg-minimal' first."
            exit 1
          fi
          echo "Embedded ffmpeg.zip size: $(du -h internal/runtime/assets/ffmpeg.zip | cut -f1)"

      - name: Run Go vet
        run: go vet ./...

      - name: Build preview binary
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          # 与 release.yml 的 desktop+ffmpeg 矩阵项同参:embed_ffmpeg + 前端 + 托盘
          mkdir -p dist
          go build -tags 'embed_ffmpeg,embedded_web,systray' \
            -ldflags='-H windowsgui -s -w' \
            -o dist/hikami-windows-amd64-desktop-ffmpeg.exe ./cmd/hikami
          cd dist && sha256sum hikami-windows-amd64-desktop-ffmpeg.exe > checksums-sha256.txt
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Summarize artifact
        run: |
          ls -lh dist/
          echo "### Preview build: \`${{ env.SHORT_SHA }}\`" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat dist/checksums-sha256.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: hikami-preview-windows-desktop-ffmpeg-${{ env.SHORT_SHA }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Move rolling preview tag
        run: |
          # 固定 tag `preview` 强制指向当前 commit,softprops 复用它更新同一条预发布。
          # 不匹配 release.yml 的 v* 触发,也不会再触发本工作流(push tag 不命中 branches: main)。
          git tag -f preview "$GITHUB_SHA"
          git push -f origin refs/tags/preview

      - name: Attach to rolling preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview
          prerelease: true
          make_latest: false
          name: Preview Build(跟踪 main,滚动更新)
          body: |
            自动构建自 main 分支最新提交 `${{ env.SHORT_SHA }}`(${{ github.sha }})。

            - 产物:`hikami-windows-amd64-desktop-ffmpeg.exe`(Windows 桌面版,内嵌前端 + 裁剪版 ffmpeg + 系统托盘)
            - 校验和见附件 `checksums-sha256.txt`
            - **这不是稳定版本**:未跑全量测试,只过了 `go vet` 门禁;正式版本见 Releases 页其它条目
          files: dist/*
