name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的 tag(需已存在,例如 v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_dispatch 手动触发时 checkout 到指定 tag 的 commit,否则(tag push)用默认
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: Build frontend
        run: npm run build
        working-directory: web

      - name: Copy frontend to embed dir
        run: |
          rm -rf cmd/hikami/webdist
          cp -r web/dist cmd/hikami/webdist

      - name: Check Go formatting
        run: |
          test -z "$(gofmt -l cmd internal)"

      - name: Run Go vet
        run: go vet ./...

      - name: Run Go tests
        run: go test ./...

  build:
    needs: test
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
            embed_ffmpeg: true
          - goos: windows
            goarch: amd64
            embed_ffmpeg: false
          - goos: windows
            goarch: amd64
            embed_ffmpeg: true
            desktop: true
          - goos: windows
            goarch: amd64
            embed_ffmpeg: false
            desktop: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_dispatch 手动触发时 checkout 到指定 tag 的 commit,否则(tag push)用默认
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
      - name: Install frontend dependencies
        run: npm ci
        working-directory: web
      - name: Build frontend
        run: npm run build
        working-directory: web
      - name: Copy frontend to embed dir
        run: |
          rm -rf cmd/hikami/webdist
          cp -r web/dist cmd/hikami/webdist
      - name: Verify embedded ffmpeg for Windows embed
        if: matrix.embed_ffmpeg
        run: |
          # 裁剪版 ffmpeg.zip 已入库（internal/runtime/assets/ffmpeg.zip），
          # 顶层结构为 bin/ffmpeg.exe + bin/ffprobe.exe，与 ffmpeg_manifest.go 的路径一致。
          # 不再从 BtbN 下载完整版（目录结构不匹配 manifest）。
          if [ ! -f internal/runtime/assets/ffmpeg.zip ]; then
            echo "ERROR: internal/runtime/assets/ffmpeg.zip not found. Run 'make build-ffmpeg-minimal' first."
            exit 1
          fi
          echo "Embedded ffmpeg.zip size: $(du -h internal/runtime/assets/ffmpeg.zip | cut -f1)"
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          # 构建 build tag 列表与产物后缀。
          # 命名约定：默认(无后缀)= 不内嵌 ffmpeg(最精简)；-ffmpeg = 内嵌 ffmpeg。
          # desktop 在 ffmpeg 之前：形如 -desktop / -desktop-ffmpeg。
          # tags 始终含 embedded_web；按需追加 embed_ffmpeg / systray。
          TAGS="embedded_web"
          SUFFIX=""
          LDFLAGS="-s -w"
          # desktop 变体：systray tag（系统托盘）+ -H windowsgui（隐藏终端窗口）
          if [ "${{ matrix.desktop }}" = "true" ]; then
            TAGS="${TAGS},systray"
            SUFFIX="-desktop"
            LDFLAGS="${LDFLAGS} -H windowsgui"
          fi
          # embed_ffmpeg：把裁剪版 ffmpeg 打进 exe
          if [ "${{ matrix.embed_ffmpeg }}" = "true" ]; then
            TAGS="embed_ffmpeg,${TAGS}"
            SUFFIX="${SUFFIX}-ffmpeg"
          fi
          BINARY=hikami-${{ matrix.goos }}-${{ matrix.goarch }}${SUFFIX}
          if [ "${{ matrix.goos }}" = "windows" ]; then BINARY="${BINARY}.exe"; fi
          mkdir -p dist
          go build -tags "${TAGS}" -ldflags="${LDFLAGS}" -o dist/${BINARY} ./cmd/hikami
          echo "ARTIFACT_NAME=hikami-${{ matrix.goos }}-${{ matrix.goarch }}${SUFFIX}" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hikami-*
          path: dist/
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/hikami-*
          generate_release_notes: true
          # tag 名含 - (如 v1.0.0-rc1 / v1.0.0-beta) 自动标为预发布
          prerelease: ${{ contains(github.ref_name, '-') || contains(inputs.tag, '-') }}
          # workflow_dispatch 手动触发时用 inputs.tag,push tag 时用 github.ref_name
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
